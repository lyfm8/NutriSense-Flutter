name: nutrisense_flutter
description: "NutriSense - Ứng dụng theo dõi dinh dưỡng thông minh với AI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # === NETWORKING (thay Retrofit2 + OkHttp + Gson) ===
  dio: ^5.4.0

  # === AUTH (Firebase - giữ nguyên concept từ Android) ===
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.0

  # === LOCAL STORAGE (thay SharedPreferences Android) ===
  shared_preferences: ^2.2.3

  # === CHARTS (thay MPAndroidChart) ===
  fl_chart: ^0.68.0

  # === ANIMATION (thay Lottie Android) ===
  lottie: ^3.1.0

  # === MEDIA (Camera + Gallery cho AI) ===
  image_picker: ^1.1.2

  # === PERMISSIONS ===
  permission_handler: ^11.3.1

  # === INTL (Date/time formatting) ===
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
